AllCops:
  DisabledByDefault: true

Security:
  Enabled: true

Layout:
  Enabled: true

Lint/Debugger:
  Enabled: true
Lint/UselessAssignment:
  Enabled: true
Lint/DuplicateMethods:
  Enabled: true
Lint/DuplicateHashKey:
  Enabled: true
Lint/UnreachableCode:
  Enabled: true
Lint/SuppressedException:
  Enabled: true
Lint/RescueException:
  Enabled: true
Lint/ShadowedException:
  Enabled: true
Lint/AssignmentInCondition:
  Enabled: true
Lint/LiteralAsCondition:
  Enabled: true
Lint/EnsureReturn:
  Enabled: true
Lint/Void:
  Enabled: true
Lint/UnusedMethodArgument:
  Enabled: true
Lint/UnusedBlockArgument:
  Enabled: true

Naming/MethodName:
  Enabled: true
Naming/VariableName:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
Style/GuardClause:
  Enabled: true
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
